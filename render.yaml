services:
  - type: web
    name: white-room
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE
        value: firestore
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: HEAD_STAFF_CODE
        sync: false
      - key: TEACHER_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRIAL_ENDS
        sync: false
